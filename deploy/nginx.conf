server {
    listen 80;
    listen [::]:80;
    server_name wowforeverdiscord.online www.wowforeverdiscord.online;
    location /.well-known/acme-challenge/ { root /var/www/wowforever-acme; }
    location / { return 301 https://www.wowforeverdiscord.online$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wowforeverdiscord.online;
    ssl_certificate /etc/letsencrypt/live/wowforeverdiscord.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wowforeverdiscord.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.wowforeverdiscord.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.wowforeverdiscord.online;
    ssl_certificate /etc/letsencrypt/live/wowforeverdiscord.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wowforeverdiscord.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 21m;
    client_body_timeout 20s;
    access_log /var/log/nginx/wowforever-access.log combined;
    error_log /var/log/nginx/wowforever-error.log warn;
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:19320;
        proxy_http_version 1.1;
        proxy_set_header Host www.wowforeverdiscord.online;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host www.wowforeverdiscord.online;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
